<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="amGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#4A90E2"/>
      <stop offset="100%" stop-color="#8E44AD"/>
    </linearGradient>
  </defs>

  <!-- Outer rounded square — fills 4px to 60px (perfectly centered) -->
  <rect x="4" y="4" width="56" height="56" rx="13" ry="13" fill="url(#amGrad)"/>

  <!-- 2x2 mosaic grid, evenly spaced & centered -->
  <!-- top-left -->
  <rect x="16" y="16" width="14" height="14" rx="2.5" fill="#ffffff" opacity="0.95"/>
  <!-- top-right -->
  <rect x="34" y="16" width="14" height="14" rx="2.5" fill="#ffffff" opacity="0.65"/>
  <!-- bottom-left -->
  <rect x="16" y="34" width="14" height="14" rx="2.5" fill="#ffffff" opacity="0.65"/>
  <!-- bottom-right -->
  <rect x="34" y="34" width="14" height="14" rx="2.5" fill="#ffffff" opacity="0.95"/>
</svg>